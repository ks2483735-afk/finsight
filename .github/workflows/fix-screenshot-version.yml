name: Fix screenshot version labels

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-screenshots:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install pillow
      - run: python scripts/fix-screenshot-version.py
      - name: Commit corrected screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/screenshots/landing-page.png public/screenshots/overview-dashboard.png
          if git diff --cached --quiet; then
            echo "No screenshot changes needed."
            exit 0
          fi
          git commit -m "Fix screenshot version labels to v0.2.0"
          git push
